name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CONVEX_URL: http://localhost:3210
      CONVEX_SELF_HOSTED_URL: http://localhost:3210
      NEXT_PUBLIC_CONVEX_URL: http://localhost:3210
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Launch Convex
        run: |
          docker compose -f ./.github/ci-support/docker-compose.yml up -d
          docker compose -f ./.github/ci-support/docker-compose.yml exec convex ./generate_admin_key.sh > admin_key.txt
          echo "CONVEX_SELF_HOSTED_ADMIN_KEY=$(cat admin_key.txt)" >> $GITHUB_ENV
      - name: Configure Convex
        run: |
          node ./.github/ci-support/generateKeys.js
          npx convex s
          npx convex deploy -v
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Build application
        run: npm run build
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Dump Convex Logs
        if: always()
        run: docker compose -f ./.github/ci-support/docker-compose.yml logs convex
