name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  eslint-prettier:
    name: ESLint & Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install modules
        run: npm ci
      - name: Run ESLint
        run: npm run lint:ci
      - name: Run Prettier
        run: npm run format:ci
  e2e:
    name: E2E (Playwright)
    needs:
      - eslint-prettier
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CONVEX_URL: http://localhost:3210
      CONVEX_SELF_HOSTED_URL: http://localhost:3210
      NEXT_PUBLIC_CONVEX_URL: http://localhost:3210
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
      NEXT_PUBLIC_EXPOSE_TEST_APIS: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Launch Convex
        run: |
          docker compose -f ./.github/ci-support/docker-compose.yml up -d
          docker compose -f ./.github/ci-support/docker-compose.yml exec convex ./generate_admin_key.sh > admin_key.txt
          echo "CONVEX_SELF_HOSTED_ADMIN_KEY=$(cat admin_key.txt)" >> $GITHUB_ENV
      - name: Configure Convex
        run: |
          sh ./.github/ci-support/generateKeys.sh
          npx convex env list
          npx convex deploy
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Build application
        run: npm run build
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Dump Convex Logs
        if: always()
        run: docker compose -f ./.github/ci-support/docker-compose.yml logs convex
